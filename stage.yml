version : "3.9"

services:
  postgres:
    image: postgres
    container_name: postgres
    volumes:
      - blog-postgres:/var/lib/postgresql/data/

    ports:
      - "5433:5432"

    env_file:
      - .envs

  app:
    container_name : app
    restart: always

    build: .
    command: gunicorn config.wsgi --bind  0.0.0.0:32852 --timeout 3600
    volumes:
      - ./:/app
#      - static_volume:/app/static
#      - media_volume:/app/media
      - ./admin_panel/backups:/app/admin_panel/backups/
      - ./media:/app/media
      - ./static:/app/static
      - ./media/app:/media/app/

    env_file:
      - .envs

    expose:
      - "32852"

    depends_on:
      - postgres
      - redis



  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:

    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"

    volumes:

      - ./default.conf:/etc/nginx/conf.d/default.conf
#      - static_volume:/home/app/static
#      - media_volume:/home/app/media
      - ./admin_panel/backups:/home/app/admin_panel/backups/
      - ./media:/home/app/media
      - ./static:/home/app/static
      - ./media/app:/home/app/media/app/

  celery-worker:
    build: .
    command: celery -A config worker -B -l info
    volumes:
      - ./:/app
    depends_on:
      - redis
      - app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings



volumes:
  blog-postgres:
  static_volume:
  media_volume:
  redis_data:
