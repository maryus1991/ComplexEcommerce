version : "3.9"

services:
  postgres:
    image: postgres
    container_name: postgres
    volumes:
      - blog-postgres:/var/lib/postgresql/data/

    ports:
      - "5433:5432"

    env_file:
      - .envs

  app:
    container_name : app
    restart: always
    build: .
    command: gunicorn config.wsgi --bind  0.0.0.0:32852 --timeout 120 
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media

    env_file:
      - .envs

    expose:
      - "32852"

    depends_on:
      - postgres

  nginx:

    image: nginx

    container_name: nginx

    restart: always

    ports:

      - "80:80"
      - "443:443"

    volumes:

      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/static
      - media_volume:/home/app/media

volumes:
  blog-postgres:
  static_volume:
  media_volume:
