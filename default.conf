upstream django {

  server app:32852;

}

server {

  listen 80;
  listen 443;
  client_max_body_size 1000M;
  proxy_read_timeout 3600;

  location /static/ {
    alias /home/app/static/;
  }

  location /media/ {
    alias /home/app/media/;
  }

  location / {

    proxy_pass http://django;


    proxy_set_header Host $host;

    proxy_buffering off;
    proxy_request_buffering off;

    proxy_read_timeout 3600;
    send_timeout 3600;
  }

}