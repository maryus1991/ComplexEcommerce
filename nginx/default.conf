
upstream django {
   server app:32852;
   }

proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=mycache:50m
                 max_size=2g
                 inactive=60m
                 use_temp_path=off;
server {

    brotli on;
    brotli_static on;
    brotli_comp_level 9;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff2;


    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 9;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff2;


    listen 80;
    server_name localhost;
    client_max_body_size 1000M;

    location /static/ {
        alias /home/app/static/;
        expires 300d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /home/app/media/;
        expires 300d;
        add_header Cache-Control "public, immutable";
        access_log off;
        add_header Vary Accept;
    }
########## NO CACHE (dynamic urls) ##########

location ^~ /user/ {
    include proxy_params;
    proxy_pass http://django;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /api/ {
    include proxy_params;
    proxy_pass http://django;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /dashboard/ {
    include proxy_params;
    proxy_pass http://django;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /admin/ {
    include proxy_params;
    proxy_pass http://django;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

location ^~ /order/ {
    include proxy_params;
    proxy_pass http://django;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}


########## CACHE FOR OTHERS ##########

location / {
    include proxy_params;

    proxy_pass http://django;

    proxy_cache mycache;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 301 302 5m;

    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;

    add_header X-Cache $upstream_cache_status always;
}

}