{% extends 'Base/AdminBase.html' %}

{% block title %}
    لیست برندها
{% endblock %}

{% block breadcrumb %}
    <li class="active">برندها</li>
    <li class="active">اضافه کردن برند</li>
{% endblock %}

{% block body %}
    <div class="box box-primary" style="margin-top:40px">
        <div class="box-header with-border">
            <h3 class="box-title">اضافه کردن برند</h3>
        </div>
        <!-- /.box-header -->
        <!-- form start -->
        <form role="form" method='POST' action='' enctype='multipart/form-data'>
            {% csrf_token %}
            <div class="box-body">
                <div class="form-group">
                    <label for="exampleInputFile">نام: </label>

                    {{ form.name }}
                </div>

                <div class="form-group">
                    <label for="exampleInputFile">لوگو </label>
                    {{ form.image }}
                </div>
                <div class="checkbox">
                    فعال کردن برند:
                    <label>
                        {{ form.is_active }}
                    </label>
                </div>
            </div>
            <!-- /.box-body -->

            <div class="box-footer">
                <button type="submit" class="btn btn-primary">ارسال</button>
            </div>
        </form>
    </div>

{% endblock %}
