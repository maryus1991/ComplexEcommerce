

{% extends 'Base/Base.html' %}

{% block title %}
    خوش امدید
{% endblock %}


{% block breadcrumb %}
    <li class="flex items-center gap-x-2">
        <a>صفحه کابری</a>
        <svg class="w-4 h-4">
            <use href="#chevron-left"></use>
        </svg>
    </li>
    <li class="flex items-center gap-x-2">
        <a>فعال سازی حساب کاربری</a>

    </li>

{% endblock %}

{% block content %}

    <main class="container flex items-center flex-col justify-center mt-8">
        <div class="max-w-lg w-full shadow">
            <div class="bg-white dark:bg-zinc-700 rounded-lg overflow-hidden">
                <div class="p-3 lg:p-8">
                    <h5 class="text-center text-xl lg:text-3xl font-DanaMedium">
                        فعال کردن حساب کاربری
                    </h5>


                    <form method="POST" action="" class="mt-8 space-y-6">
                        {% csrf_token %}
                        <div class="flex w-full items-center bg-gray-100 dark:bg-zinc-500/30 rounded-lg  px-3">
                            {{ login_form.phone_number }}
                            <svg class="h-5 w-5 text-gray-500 dark:text-gray-200">
                                <use href="#envelope"></use>
                            </svg>
                        </div>
                        <script>
                            document.addEventListener('DOMContentLoaded', function () {
                                function getAllQueryParams(paramName) {
                                    const params = new URLSearchParams(window.location.search);
                                    return params.getAll(paramName); // این متد تمام مقادیر یک پارامتر را برمی‌گرداند
                                }

                                const tel = getAllQueryParams('tel');
                                if (tel.length > 0) {
                                    document.getElementById('id_phone_number').value = tel;
                                }
                            })
                        </script>


                        <div class="flex items-center justify-between mt-4">
                            <div class="text-sm">
                                <a class="font-medium text-green-500 hover:text-green-600"
                                   href="{% url 'user:login' %}">
                                    ورود
                                </a>
                            </div>
                            <div class="text-sm">
                                <a class="font-medium text-green-500 hover:text-green-400"
                                   href="{% url 'user:register' %}">ثبت نام </a>

                            </div>
                        </div>
                        <div>
                            <button
                                    class="group transition-colors relative w-full flex justify-center py-3 px-4 border border-transparent font-DanaMedium rounded-lg text-white bg-green-500 hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                                    type="submit">
                                وارد شوید
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

    </main>

{% endblock %}
